<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crest Health</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f2f1 0%, #ffffff 50%, #e8f5e9 100%);
      color: #1a1a1a;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: #00796b;
      letter-spacing: -0.5px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 1.05rem;
      color: #5f6368;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: #00796b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }

    .btn:hover {
      background: #00695c;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    footer {
      position: fixed;
      bottom: 24px;
      font-size: 0.85rem;
      color: #9e9e9e;
    }
  </style>
</head>
<body>

  <div class="logo-section">
    <h1>Crest Health</h1>
    <p class="tagline">Your wellness, simplified.</p>
  </div>

  <a href="daily-goal-privaycy-policy.html" class="btn">Daily Goal Tracker</a>

  <footer>&copy; 2026 Crest Health. All rights reserved.</footer>

</body>
</html>
